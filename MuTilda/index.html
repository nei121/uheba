<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuTilda - Конструктор сайтов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="app-container">
        <!-- Панель инструментов -->
        <div class="toolbar">
            <div class="logo">
                <span class="logo-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4H20V20H4V4Z" stroke="url(#grad)" stroke-width="2" fill="none"/>
        <rect x="7" y="7" width="4" height="4" rx="1" fill="#4d9eff"/>
        <rect x="13" y="7" width="4" height="4" rx="1" fill="#6b47dc"/>
        <rect x="7" y="13" width="4" height="4" rx="1" fill="#8b5cf6"/>
        <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#4d9eff"/>
                <stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
        </defs>
    </svg>
</span>
                <span class="logo-text">MuTilda</span>
                <span class="logo-beta">beta</span>
            </div>
            <div class="toolbar-buttons">
                <button class="tool-btn" onclick="openPageManager()">📄 Страницы</button>
                <button class="tool-btn" onclick="openHeaderSettings()">🏠 Шапка</button>
                <button class="tool-btn" onclick="openFooterSettings()">📞 Подвал</button>

                <button class="tool-btn" onclick="addBlock('text')">📝 Текст</button>
                <button class="tool-btn" onclick="addBlock('heading')">📌 Заголовок</button>
                <button class="tool-btn" onclick="addBlock('image')">🖼️ Изображение</button>
                <button class="tool-btn" onclick="addBlock('button')">🔘 Кнопка</button>
                <button class="tool-btn" onclick="addBlock('separator')">➖ Разделитель</button>
                <button class="tool-btn" onclick="addBlock('html')">🔧 HTML код</button>
                
                
            </div>
            <div class="action-buttons">
                <button class="action-btn preview" onclick="previewSite()">👁️ Просмотр</button>
                <button class="action-btn save" onclick="saveSite()">💾 Сохранить</button>
                <button class="action-btn clear" onclick="clearSite()">🗑️ Очистить</button>
            </div>
        </div>

        <!-- Рабочая область -->
        <div class="workspace">
            <div class="canvas" id="canvas">
                <div class="empty-message" id="emptyMessage">
                    <span>➕</span>
                    <p>Добавьте первый блок с помощью панели инструментов</p>
                </div>
            </div>
        </div>

        <!-- Боковая панель свойств -->
        <div class="properties-panel" id="propertiesPanel">
            <div class="panel-header">
                <h3>⚙️ Свойства</h3>
                <button class="close-panel" onclick="closeProperties()">✕</button>
            </div>
            <div class="panel-content" id="panelContent">
                <p style="color: #888; text-align: center;">Выберите блок для редактирования</p>
            </div>
        </div>
    </div>

    <script src="header-footer.js"></script>
    <script src="script.js"></script>
</body>
</html>
