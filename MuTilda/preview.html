<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предпросмотр сайта - MuTilda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Запрет выделения текста */
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }

        .preview-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 40px;
            min-height: 100vh;
        }

        .preview-header {
            text-align: center;
            padding-bottom: 20px;
            margin-bottom: 30px;
            border-bottom: 2px solid #4d9eff;
        }

        .preview-header h1 {
            font-size: 2rem;
            color: #1e2a4a;
        }

        .preview-header p {
            color: #888;
            margin-top: 10px;
        }

        .preview-content {
            line-height: 1.6;
        }

        /* Стили для блоков */
        .preview-content .block-text {
            font-size: 1rem;
            margin: 15px 0;
        }

        .preview-content .block-heading h2 {
            font-size: 1.8rem;
            margin: 15px 0;
            color: #1e2a4a;
        }

        .preview-content .block-image {
            margin: 15px 0;
        }

        .preview-content .block-image img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .preview-content .block-button {
            text-align: center;
            margin: 15px 0;
        }

        .preview-content .block-button a {
            display: inline-block;
            background: #4d9eff;
            color: #fff;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .preview-content .block-button a:hover {
            background: #3a7fd4;
        }

        /* Запрет выделения для кнопок при клике */
        .preview-content .block-button a:active {
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .preview-content .block-separator hr {
            margin: 20px 0;
            border: none;
            height: 2px;
            background: linear-gradient(90deg, #4d9eff, #ccc);
        }

        .preview-content .block-html {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: monospace;
        }

        .preview-footer {
            text-align: center;
            padding-top: 30px;
            margin-top: 30px;
            border-top: 1px solid #eee;
            color: #888;
            font-size: 0.85rem;
        }

        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            z-index: 1000;
            font-weight: bold;
            user-select: none;
        }

        .close-btn:hover {
            background: #c0392b;
        }

        /* Запрет выделения для всех элементов */
        .preview-content * {
            user-select: none;
            -webkit-user-select: none;
        }

        /* Разрешаем выделение только для полей ввода, если они есть */
        .preview-content input,
        .preview-content textarea {
            user-select: text;
            -webkit-user-select: text;
        }
    </style>
</head>
<body>
    <button class="close-btn" onclick="window.close()">✕ Закрыть</button>
    
    <div class="preview-container">
       
        <div class="preview-content" id="previewContent">
            <p style="color: #aaa; text-align: center;">Загрузка...</p>
        </div>
        
         
    </div>

    <script>
        // Получаем данные из localStorage
        const savedHtml = localStorage.getItem('matilda_preview');
        
        if (savedHtml && savedHtml !== '') {
            document.getElementById('previewContent').innerHTML = savedHtml;
            
            // Дополнительная защита от редактирования
            const allElements = document.querySelectorAll('.preview-content *');
            allElements.forEach(el => {
                // Убираем contenteditable если остался
                el.removeAttribute('contenteditable');
                // Запрещаем выделение
                el.style.userSelect = 'none';
                el.style.webkitUserSelect = 'none';
            });
            
            // Кнопки не должны выделяться при клике
            const buttons = document.querySelectorAll('.block-button a, .block-button button');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                   // alert('В режиме предпросмотра переход по ссылкам отключён');
                    return false;
                });
            });
        } else {
            document.getElementById('previewContent').innerHTML = '<p style="color: #aaa; text-align: center;">Нет данных для предпросмотра. Сохраните сайт в конструкторе.</p>';
        }
    </script>
</body>
</html>
